name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.3-stable

jobs:
  typescript:
    name: Typecheck, lint, unit tests, content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema database/schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - name: Engine unit tests (simulation, solver, generator)
        run: npm test -w @loopfactory/engine
      - name: Curated levels and achievements are up to date
        run: npm run levels:check
      - name: Cross-language parity fixtures are up to date
        run: npm run fixtures:check
      - name: OpenAPI document is up to date
        run: npm run openapi -w @loopfactory/api -- --check
      - name: Build API bundle
        run: npm run build -w @loopfactory/api

  api:
    name: API integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: loop, POSTGRES_PASSWORD: loop, POSTGRES_DB: loopfactory_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loop" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://loop:loop@localhost:5432/loopfactory_test
      DATABASE_URL: postgresql://loop:loop@localhost:5432/loopfactory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate migrations apply cleanly to an empty database
        run: npx prisma migrate deploy --schema database/schema.prisma
      - name: Schema and migrations are in sync
        run: npx prisma migrate diff --from-migrations database/migrations --to-schema-datamodel database/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
      - run: npx prisma generate --schema database/schema.prisma
      - run: npm test -w @loopfactory/api

  game:
    name: Godot game logic tests + client/server E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: loop, POSTGRES_PASSWORD: loop, POSTGRES_DB: loopfactory_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loop" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://loop:loop@localhost:5432/loopfactory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx prisma generate --schema database/schema.prisma
      - name: Install Godot (headless)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
      - name: Virtual display + Mesa for the UI layout tests
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Game tests (engine parity, rules, save/resume, all scripts compile, UI layout on 5 aspect ratios)
        run: ./scripts/test-game.sh
      - name: Client <-> API end-to-end (offline play, sync, daily submission)
        run: ./scripts/e2e.sh

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: false
          tags: loopfactory-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android debug APK (Godot export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Godot + export templates (cached)
        uses: actions/cache@v4
        id: godot-cache
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}
      - if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache && cd ~/godot-cache
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
      - name: Configure Godot for Android export
        run: |
          cd ~/godot-cache && unzip -oq godot.zip && sudo cp "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable && unzip -oq templates.tpz -d /tmp/tpl && cp -r /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          keytool -genkeypair -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.3.tres
      - run: ./scripts/build-android.sh debug
      - name: Verify APK signature
        run: $(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner verify --verbose apps/game/build/loopfactory-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: loopfactory-debug-apk
          path: apps/game/build/loopfactory-debug.apk
