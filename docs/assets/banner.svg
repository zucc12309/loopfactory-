<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Loop Factory — rotate belts, deliver every package">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#26283A" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1280" height="320" rx="28" fill="#F7F5F0"/>
  <!-- decorative belt track -->
  <path d="M990 250 H1150 a44 44 0 0 0 44 -44 V114 a44 44 0 0 0 -44 -44 H1060" fill="none" stroke="#C9CEE8" stroke-width="34" stroke-linecap="round"/>
  <g stroke="#AEB5DA" stroke-width="4" stroke-linecap="round">
    <line x1="1020" y1="238" x2="1020" y2="262"/><line x1="1100" y1="238" x2="1100" y2="262"/>
    <line x1="1182" y1="160" x2="1206" y2="160"/><line x1="1110" y1="58" x2="1110" y2="82"/>
  </g>
  <rect x="912" y="210" width="80" height="80" rx="18" fill="#F28B66" filter="url(#sh)"/>
  <polygon points="968,250 944,236 944,264" fill="#fff"/>
  <rect x="1046" y="230" width="40" height="40" rx="9" fill="#F28B66"/>
  <rect x="1174" y="128" width="40" height="40" rx="9" fill="#F28B66"/>
  <circle cx="1020" cy="70" r="40" fill="#FBE3D9"/><circle cx="1020" cy="70" r="34" fill="none" stroke="#F28B66" stroke-width="10"/><circle cx="1020" cy="70" r="10" fill="#F28B66"/>
  <!-- logo -->
  <g transform="translate(64 64)" filter="url(#sh)">
    <rect width="192" height="192" rx="44" fill="#FFFFFF"/>
    <circle cx="96" cy="96" r="58" fill="none" stroke="#C9CEE8" stroke-width="26"/>
    <rect x="84" y="26" width="24" height="24" rx="6" fill="#F28B66" transform="rotate(20 96 96)"/>
    <rect x="84" y="26" width="24" height="24" rx="6" fill="#4F9BEA" transform="rotate(140 96 96)"/>
    <rect x="84" y="26" width="24" height="24" rx="6" fill="#3FB596" transform="rotate(260 96 96)"/>
    <circle cx="96" cy="96" r="22" fill="#5C6BC0"/><circle cx="96" cy="96" r="9" fill="#F7F5F0"/>
  </g>
  <text x="300" y="150" font-family="Nunito, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="72" fill="#26283A">Loop Factory</text>
  <text x="302" y="200" font-family="Nunito, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#7A7D92">Rotate belts. Deliver every package.</text>
  <text x="302" y="240" font-family="Nunito, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#5C6BC0">A calm, offline-first puzzle game for one-minute breaks</text>
